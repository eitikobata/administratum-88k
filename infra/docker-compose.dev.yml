# Local-dev-only infra. In production, Postgres and Redis are the shared
# EasyPanel services already running on the VPS (see other portfolio
# projects) — this file never gets deployed anywhere.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: administratum88k
    ports:
      - '5432:5432'
    volumes:
      - administratum_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  administratum_postgres_data:
